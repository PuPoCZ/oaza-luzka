<!DOCTYPE html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rozmístění lůžek Oáza klidu</title><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&amp;family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"><style id="app-css">/* Plánovač lůžek: tenká horní lišta, vlevo výkres podlaží, vpravo souhrn a vlastnosti výběru, pod tím tabulka pokojů. */
:root {
  --bg: #f4f5f4;
  --surface: #ffffff;
  --ink: #1d2427;
  --muted: #5d686d;
  --line: #d8dddd;
  --accent: #1f5f73;
  --accent-soft: #e2eef1;
  --ok: #2f7d4f;
  --warn: #a8660b;
  --bad: #b3261e;
  --paper: #ffffff;
  --paper-ink: #222;
  --wall: #cfd3d4;
  --f-body: "IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191b; --surface: #1d2326; --ink: #e4e8e9; --muted: #9aa5a9; --line: #333c40;
    --accent: #7fc3d6; --accent-soft: #23353b; --ok: #6cc08e; --warn: #e3a646; --bad: #ff8a80;
    --paper: #f7f7f5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191b; --surface: #1d2326; --ink: #e4e8e9; --muted: #9aa5a9; --line: #333c40;
  --accent: #7fc3d6; --accent-soft: #23353b; --ok: #6cc08e; --warn: #e3a646; --bad: #ff8a80;
  --paper: #f7f7f5; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); font-weight: 600; }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.danger { color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], select, textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 8px; }
textarea { width: 100%; resize: vertical; min-height: 54px; }
.tab-num { font-variant-numeric: tabular-nums; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 600; text-wrap: balance; }
header.top h1 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.scen { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.scen label { color: var(--muted); font-size: 12px; }
.scen select { max-width: 260px; }
.spacer { flex: 1; }
.savebox { display: flex; align-items: center; gap: 8px; }
.status { font-size: 12px; color: var(--muted); }
.status.dirty { color: var(--warn); font-weight: 600; }
.status.err { color: var(--bad); font-weight: 600; }

.banner { margin: 10px 16px 0; padding: 8px 12px; border-radius: 6px; background: var(--accent-soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

main.grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 12px 16px 16px; align-items: start; }
@media (max-width: 980px) { main.grid { grid-template-columns: 1fr; } }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.group { display: flex; gap: 4px; align-items: center; }
.floor-tab b { font-variant-numeric: tabular-nums; margin-left: 4px; font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; }
.svgwrap { position: relative; height: clamp(420px, 66vh, 880px); background: var(--paper); touch-action: none; }
.svgwrap svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.svgwrap.adding svg { cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 10px; border: 1.5px solid; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

aside { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 64px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.card h2 { font-size: 13px; text-transform: none; margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 span { font-weight: 400; color: var(--muted); font-size: 12px; }
.big { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big small { font-size: 14px; color: var(--muted); font-weight: 400; }
.limits { display: grid; gap: 6px; margin-top: 10px; }
.lim { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; }
.lim .bar { grid-column: 1 / -1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.lim .bar > div { height: 100%; background: var(--ok); }
.lim.full .bar > div { background: var(--accent); }
.lim.over .bar > div { background: var(--bad); }
.lim.over .v { color: var(--bad); font-weight: 600; }
.sexrow { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 260px; overflow: auto; }
.checks li { font-size: 12.5px; padding: 5px 8px; border-left: 3px solid var(--line); background: var(--bg); border-radius: 0 4px 4px 0; cursor: pointer; }
.checks li.bad { border-color: var(--bad); }
.checks li.warn { border-color: var(--warn); }
.checks li.info { border-color: var(--accent); cursor: default; }
.checks li.okmsg { border-color: var(--ok); cursor: default; }
.field { display: grid; gap: 3px; margin-bottom: 8px; }
.field > label { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; margin-bottom: 8px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.settings summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.settings .sgrid { display: grid; grid-template-columns: 1fr 70px; gap: 4px 8px; margin-top: 8px; align-items: center; font-size: 12.5px; }
.settings input { width: 70px; }

section.tablecard { margin: 0 16px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
section.tablecard header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
section.tablecard h2 { margin: 0; font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: 12px; background: var(--bg); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--accent-soft); }
tbody tr.sel { background: var(--accent-soft); }
tfoot td { font-weight: 600; }
.d-plus { color: var(--ok); font-weight: 600; }
.d-minus { color: var(--bad); font-weight: 600; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.pill.warn { border-color: var(--warn); color: var(--warn); }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.modal .box { background: var(--surface); border-radius: 10px; padding: 16px; width: min(640px, 100%); display: grid; gap: 10px; }
.modal textarea { min-height: 220px; font-family: var(--f-mono); font-size: 12px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 30; }

/* výkres */
.r-fill { stroke: none; }
.r-hit { cursor: pointer; }
.r-id { font-family: var(--f-mono); fill: #7a8487; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: var(--halo, 0); }
.r-name { font-family: var(--f-body); fill: #2a3134; font-weight: 600; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: var(--halo, 0); }
.r-chip { font-family: var(--f-body); fill: #2a3134; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: var(--halo, 0); }
.r-delta { font-family: var(--f-body); font-weight: 700; pointer-events: none; paint-order: stroke; stroke: #fff; stroke-width: var(--halo, 0); }
.e-dim { font-family: var(--f-mono); fill: #1f5f73; font-weight: 400; }
.gaps { stroke: #e8710a; stroke-width: var(--hair, 0); }
.gaps text { fill: #b4530a; stroke: #fff; stroke-width: var(--halo, 0); paint-order: stroke; font-family: var(--f-mono); font-weight: 600; pointer-events: none; }
.is-ov .r-fill { cursor: pointer; }
.is-ov .r-fill:hover { fill-opacity: .55; }
.is-ov .bed { cursor: pointer; }
.detail .r-fill { cursor: pointer; }
.ovl { position: absolute; left: 12px; bottom: 10px; display: grid; gap: 4px; pointer-events: none; }
.ov-title { position: absolute; left: 0; bottom: 30px; white-space: nowrap; font-weight: 700; font-size: 15px; color: #1d2427; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 4px; }
.ov-scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #333; background: rgba(255,255,255,.85); padding: 3px 6px; border-radius: 4px; }
.ov-scale .bar { height: 6px; border: 1.5px solid #333; border-top: 0; }
.minimap svg { width: 100%; height: auto; display: block; }
.minimap path[data-goto] { cursor: pointer; }
.minimap path[data-goto]:hover { fill: #f6c08f; }
.toolhint { padding: 6px 10px; border-bottom: 1px solid var(--line); }
.status.ok { color: var(--ok); }
.bed { cursor: grab; }
.bed.drag { cursor: grabbing; }
.bed-lbl { font-family: var(--f-body); font-weight: 600; fill: #222; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }

.card.compact { padding: 10px 12px; }
.card.compact h2 { margin-bottom: 6px; }
.selcard { border-color: #e8710a; box-shadow: inset 3px 0 0 #e8710a; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
.two .field { margin-bottom: 6px; }
.two input, .two select { width: 100%; min-width: 0; }
.chk { font-size: 13px; display: flex; gap: 6px; align-items: center; padding-bottom: 12px; }
.seg.full { display: flex; margin-bottom: 8px; }
.seg.full button { flex: 1; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
details.note summary, details.more summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin: 4px 0; }
details.note textarea { margin-top: 4px; }
details.more { margin-top: 8px; }
details.more .row { margin-top: 6px; }
.card.compact .hint { margin: 6px 0; }
button.small { font-size: 12.5px; padding: 3px 8px; }
.minisum { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.minisum b { color: var(--ink); }
.minisum .bad, .minisum .bad b { color: var(--bad); }
.card.compact .checks { margin-top: 8px; }
.two input[type=checkbox] { width: auto; }
.minimap svg { max-height: 190px; }

#stat { display: inline-block; width: 112px; white-space: nowrap; overflow: hidden; }
#stat .status { display: inline-flex; align-items: center; gap: 6px; }
#stat .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
#stat .status.ok i { background: var(--ok); }
#stat .status.busy i { background: var(--warn); }
#stat .status.err i { background: var(--bad); }
#stat .status.dirty i { background: var(--warn); }
header.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; }
header.top .spacer { display: none; }
header.top .scen { flex-wrap: wrap; min-width: 0; }
header.top .scen select { min-width: 0; max-width: 220px; }
header.top .savebox { justify-self: end; flex-wrap: nowrap; }
@media (max-width: 760px) {
  header.top { grid-template-columns: minmax(0, 1fr) auto; }
  header.top .scen { grid-column: 1 / -1; grid-row: 2; }
  header.top h1 small { display: none; }
}
header.top .pair { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
@media (max-width: 1250px) { header.top h1 small { display: none; } }

<script>
// Napojení plánovače na Firebase Firestore místo databáze claude.ai.
// Stránka používá stejné rozhraní (doc / collection / onSnapshot / set / delete).
(function () {
  let resolveDb; const dbReady = new Promise(r => { resolveDb = r; });
  window.__fbResolve = resolveDb;
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'image/svg+xml' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
  };
  window.claude = {
    use: async name => {
      if (name === 'db') return Promise.race([dbReady, new Promise(r => setTimeout(() => r(null), 15000))]);
      if (name === 'user') return { can: async () => true };
      if (name === 'downloads') return downloads;
      return null;
    }
  };
})();
</script>

const fs = getFirestore(app);
const wrapDoc = d => ({ id: d.id, exists: d.exists(), data: () => d.data(), metadata: d.metadata });
const err = cb => e => cb && cb({ code: (e && e.code === 'permission-denied') ? 'invalid_argument' : 'unavailable', message: String(e && e.message) });
const docRef = path => ({
  id: path.split('/').pop(), path,
  set: data => setDoc(doc(fs, path), data),
  delete: () => deleteDoc(doc(fs, path)),
  onSnapshot: (next, e) => onSnapshot(doc(fs, path), d => next(wrapDoc(d)), err(e))
});
const db = {
  doc: docRef,
  collection: path => ({
    path,
    doc: id => docRef(path + '/' + id),
    onSnapshot: (next, e) => onSnapshot(collection(fs, path), s => next({ docs: s.docs.map(wrapDoc), size: s.size, empty: s.empty, metadata: s.metadata }), err(e))
  })
};
window.__fbResolve(db);
</script>

function showText(title, txt) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><b>${esc(title)}</b><textarea readonly>${esc(txt)}</textarea><div class="row"><button>Zavřít</button></div></div>`;
  document.body.appendChild(m); m.querySelector('button').onclick = () => m.remove(); m.querySelector('textarea').select();
}
function pasteDialog() {
  if (!canEdit()) return;
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><b>Vložit data</b><p class="hint">Vlož data zkopírovaná tlačítkem Kopírovat data. Varianty se přidají k těm stávajícím.</p><textarea id="pasteTa"></textarea><div class="row"><button class="primary" id="pasteOk">Přidat varianty</button><button id="pasteNo">Zrušit</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector('#pasteNo').onclick = () => m.remove();
  m.querySelector('#pasteOk').onclick = () => {
    try {
      const d = JSON.parse(m.querySelector('#pasteTa').value), src = d.S || d;
      const list = src.scenarios || (src.beds ? [src] : null); if (!list) throw new Error('bez variant');
      change(() => list.forEach(sc => { const c = JSON.parse(JSON.stringify(sc)); c.id = uid('s'); FLOORS.forEach(fk => (c.beds[fk] || []).forEach(b => b.id = uid('b'))); FLOORS.forEach(fk => ((c.items || {})[fk] || []).forEach(b => b.id = uid('k'))); if (S.scenarios.some(s => s.name === c.name)) c.name += ' (vloženo)'; S.scenarios.push(c); S.active = c.id; }));
      m.remove(); toast('Přidáno variant: ' + list.length);
    } catch (err) { toast('Data se nepodařilo načíst. Zkontroluj, že je vložený celý text.'); }
  };
}
function copyTable() {
  const sc = scen(), a = analyse(sc);
  const ids = Object.keys(ROOMS).filter(id => (a.rooms[id] && a.rooms[id].n) || roomMeta(sc, id).use === 'pokoj').sort();
  const lines = [['Část budovy', 'Č.', 'Název', 'Účel', 'm²', 'Lůžka', 'Ž', 'M', 'm²/lůžko'].join('\t')];
  ids.forEach(id => { const r = ROOMS[id], m = roomMeta(sc, id), o = a.rooms[id] || { n: 0, Z: 0, M: 0 }; lines.push([VIEW[viewOfRoom(id)].label, id, m.name, (USE[m.use] || USE.jine).name, fmt(r.area), o.n, o.Z, o.M, o.n ? fmt(r.area / o.n) : ''].join('\t')); });
  lines.push(['Celkem', '', '', '', '', a.total, a.sex.Z, a.sex.M, ''].join('\t'));
  copyText(lines.join('\n'), 'Tabulka je ve schránce, vlož ji do Excelu nebo Wordu.');
}
let dlNs = null;
async function downloadSvg() {
  const H = BOUNDS.h, keepK = ui.k;
  ui.k = BOUNDS.w / 1400;
  const parts = ['1NP', '2NP-H', '3NP'].map(k => renderPlan({ page: 'overview', view: k, vb: BOUNDS, export: true }).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, ''));
  ui.k = keepK;
  const titles = ['1.NP', '2.NP', '3.NP'];
  const out = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="${BOUNDS.x} ${BOUNDS.y} ${BOUNDS.w} ${H * 3 + 2}" width="${Math.round(BOUNDS.w * 10)}mm" height="${Math.round((H * 3 + 2) * 10)}mm"><style>.r-id{font-family:monospace;fill:#7a8487}.r-name{font-family:sans-serif;font-weight:600;fill:#2a3134}.r-chip{font-family:sans-serif;fill:#2a3134}.r-delta{font-family:sans-serif;font-weight:700}.bed-lbl{font-family:sans-serif;font-weight:600}</style>` +
    parts.map((p, i) => `<g transform="translate(0,${i * (H + 1)})">${p}<text x="${BOUNDS.x + BOUNDS.w - 0.6}" y="${BOUNDS.y + 1.2}" text-anchor="end" font-size=".8" font-weight="700" font-family="sans-serif">${titles[i]}</text></g>`).join('') + '</svg>';
  try { await dlNs.save({ filename: `Rozmístění lůžek – ${scen().name}.svg`.replace(/[:?*"<>|\\/]/g, ''), data: out }); }
  catch (e) { toast('Stažení se nepovedlo nebo bylo zrušeno.'); }
}

// ---------- start ----------
if (!scenById(S.active)) S.active = S.scenarios[0].id;
if (S.compare && !scenById(S.compare)) S.compare = '';
routeFromHash();
render();
(function hook(n) {
  if (window.claude && typeof window.claude.use === 'function') {
    connect();
    window.claude.use('downloads').then(d => { if (d) { dlNs = d; render(); } }).catch(() => {});
  } else if (n < 20) setTimeout(() => hook(n + 1), 250);
  else goLocal();
})(0);
})();
</script>
